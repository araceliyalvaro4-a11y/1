<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Veo 3 Generator Prompt</title>
    <style>
      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        line-height: 1.5;
        margin: 2rem;
        color: #111;
      }
      main {
        max-width: 720px;
        margin: 0 auto;
      }
      h1 {
        font-size: 1.8rem;
        margin-bottom: 1rem;
      }
      section {
        border: 1px solid #ddd;
        border-radius: 8px;
        padding: 1rem 1.25rem;
        margin-bottom: 1rem;
        background: #fafafa;
      }
      dt {
        font-weight: 600;
      }
      dd {
        margin: 0.25rem 0 0.75rem 0;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Veo 3 Generator Prompt</h1>

      <section>
        <dl>
          <dt>Prompt Type</dt>
          <dd>HTML</dd>

          <dt>Upload</dt>
          <dd>Files / Images</dd>

          <dt>Duration</dt>
          <dd>1 minute and 15 seconds</dd>
        </dl>
      </section>

      <section>
        <p>Use this template to structure your Veo 3 generator prompt and ensure the required assets and duration are clearly specified.</p>
      </section>
    </main>
  </body>
</html>
